[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fal-demo-flux-training"
version = "0.0.1"
description = "Deploy Flux LoRA training on fal"
requires-python = ">=3.11"
dependencies = [
    "fal",
    "pydantic",
    "torch==2.4.0",
    "diffusers==0.30.3",
    "transformers==4.46.0",
    "tokenizers==0.20.1",
    "sentencepiece",
    "peft==0.12.0",
    "safetensors==0.4.4",
    "accelerate==1.4.0",
    "pyzmq==26.0.0",
    "huggingface_hub==0.26.5",
    "fal-client",  # For calling preprocessor app
]

[tool.setuptools.packages.find]
include = ["fal_demo_flux_training*"]

[tool.fal.apps.flux-training]
python_entry_point = "fal_demo_flux_training.app:FluxLoRATrainingApp"
auth = "private"
requirements = ["."]
python_version = "3.11"
machine_type = "GPU-H100"
num_gpus = 2
keep_alive = 3000
min_concurrency = 1
max_concurrency = 1
