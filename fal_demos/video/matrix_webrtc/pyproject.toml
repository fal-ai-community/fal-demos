[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fal-demo-matrix-webrtc"
version = "0.0.1"
description = "Deploy Matrix WebRTC on fal"
requires-python = ">=3.11"
dependencies = [
    "fal",
    "pydantic>=2.0",
    "accelerate>=1.1.1",
    "aiortc",
    "av",
    "dashscope",
    "diffusers",
    "dominate",
    "easydict",
    "einops",
    "flask",
    "flask-socketio",
    "ftfy",
    "clip @ git+https://github.com/openai/CLIP.git",
    "huggingface-hub[cli]",
    "imageio",
    "imageio-ffmpeg",
    "lmdb",
    "matplotlib",
    "nvidia-tensorrt",
    "numpy",
    "omegaconf",
    "onnx",
    "onnxconverter_common",
    "onnxruntime",
    "onnxscript",
    "open_clip_torch",
    "opencv-python>=4.9.0.80",
    "pycocotools",
    "safetensors",
    "scikit-image",
    "sentencepiece",
    "starlette",
    "tokenizers>=0.20.3",
    "torch==2.6.0",
    "torchao==0.12.0",
    "torchvision",
    "tqdm",
    "transformers>=4.49.0",
    "wandb",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp311-cp311-linux_x86_64.whl",
]

[project.optional-dependencies]
client = [
    "fal-client",
]

[tool.setuptools.packages.find]
include = ["fal_demo_matrix_webrtc*"]

[tool.fal.apps.matrix-webrtc]
python_entry_point = "fal_demo_matrix_webrtc.app:MatrixWebRTC2"
auth = "private"
requirements = ["."]
python_version = "3.11"
machine_type = "GPU-H100"
startup_timeout = 1200
