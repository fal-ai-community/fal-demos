[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fal-demo-kokoro"
version = "0.0.1"
description = "Deploy Kokoro on fal"
requires-python = ">=3.11"
dependencies = [
    "fal",
    "pydantic",
    "kokoro==0.8.4",
    "soundfile==0.13.1",
    "misaki[en]==0.8.4",
    "misaki[ja]==0.8.4",
    "misaki[zh]==0.8.4",
    "numpy==1.26.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.setuptools.packages.find]
include = ["fal_demo_kokoro*"]

[tool.fal.apps.kokoro]
python_entry_point = "fal_demo_kokoro.app:Kokoro"
auth = "private"
requirements = ["."]
python_version = "3.11"
# Use a CPU machine type since Kokoro is only 82M parameters and runs efficiently on CPU.
machine_type = "L"
keep_alive = 3000
min_concurrency = 0
max_concurrency = 1
