[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fal-demo-vllm"
version = "0.0.1"
description = "Deploy vLLM on fal"
requires-python = ">=3.11"
dependencies = [
    "fal",
]

[tool.setuptools]
packages = []

[tool.fal.apps.vllm]
auth = "private"
machine_type = "GPU-H100"
exposed_port = 8000

[tool.fal.apps.vllm.image]
dockerfile = "Dockerfile"
