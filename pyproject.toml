[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "fal_demos/_version.py"
fallback_version = "0.0.0"

[project]
name = "fal_demos"
dynamic = ["version"]
description = "Examples of building with Fal's SDK"
readme = "README.md"
dependencies = [
    "pydantic<2.0,>=1.8",
    "pyyaml",
    "fal @ git+https://github.com/fal-ai/fal.git#subdirectory=projects/fal"
]

[project.optional-dependencies]
birefnet = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==4.51.3",
    "accelerate==1.6.0",
    "safetensors==0.5.3",
    "numpy==1.26.4",
    "timm==1.0.15",
    "kornia==0.8.0",
    "einops==0.8.1",
    "scipy==1.15.2",
    "scikit-image==0.25.2",
    "opencv-python-headless==4.11.0.86",
    "prettytable==3.16.0",
    "pillow==11.2.1",
    "hf_transfer==0.1.9",
]

[tool.fal.apps.sana]
ref = "fal_demos/image/sana.py::Sana"

[tool.fal.apps.kokoro]
ref = "fal_demos/tts/kokoro.py::Kokoro"

[tool.fal.apps.diffrhythm]
ref = "fal_demos/audio/diffrhythm.py::DiffRhythm"

[tool.fal.apps.wan]
ref = "fal_demos/video/wan.py::Wan"

[tool.fal.apps.hunyuan3d]
ref = "fal_demos/image/hunyuan3d.py::Hunyuan3D"

[tool.fal.apps.matrix-webrtc]
ref = "fal_demos/video/matrix_webrtc/matrix.py::MatrixGame2"


# Distributed inference examples
[tool.fal.apps.parallel-sdxl]
ref = "fal_demos/distributed/inference/parallel_sdxl/app.py::ExampleDistributedApp"

[tool.fal.apps.xfuser]
ref = "fal_demos/distributed/inference/xfuser/app.py::XFuserApp"

# Distributed training examples
[tool.fal.apps.flux-preprocessor]
ref = "fal_demos/distributed/training/flux_lora/preprocessor/flux_preprocessor_app.py::FluxPreprocessorApp"

[tool.fal.apps.flux-training]
ref = "fal_demos/distributed/training/flux_lora/trainer/app.py::FluxLoRATrainingApp"

[tool.fal.apps.birefnet-rmbg]
python_entry_point = "fal_demos.image.birefnet_rmbg:BiRefNetRMBG"
machine_type = "GPU-RTXPRO6000"
python_version = "3.11"
requirements = [".[birefnet]"]
min_concurrency = 0
max_concurrency = 2
keep_alive = 300

# LLM examples
[tool.fal.apps.vllm]
machine_type = "GPU-H100"
exposed_port = 8000

[tool.fal.apps.vllm.image]
dockerfile = "fal_demos/llm/vllm/Dockerfile"

[tool.fal.apps.sglang]
machine_type = "GPU-H100"
exposed_port = 30000

[tool.fal.apps.sglang.image]
dockerfile = "fal_demos/llm/sglang/Dockerfile"

[tool.fal.apps.ollama]
machine_type = "GPU-RTX5090"
exposed_port = 11434

[tool.fal.apps.ollama.image]
image = "ollama/ollama"

[tool.fal.apps.comfyui]
machine_type = "GPU-RTX5090"
exposed_port = 18188

[tool.fal.apps.comfyui.image]
image = "ghcr.io/ai-dock/comfyui@sha256:fca2636bc177da48f25a546f0f55100b14ecb65ea26c674993370e549ba868c0"
cmd = ["env", "COMFYUI_ARGS=--listen 0.0.0.0", "init.sh"]
